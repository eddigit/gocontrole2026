services:
  postgres:
    image: postgres:16-alpine
    container_name: gocontrole-db
    environment:
      POSTGRES_DB: gocontrole
      POSTGRES_USER: gocontrole
      POSTGRES_PASSWORD: gocontrole_secret
    volumes:
      - gocontrole_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gocontrole"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gocontrole-redis
    volumes:
      - gocontrole_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gocontrole-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://gocontrole:gocontrole_secret@postgres:5432/gocontrole?schema=public
      POSTGRES_PRISMA_URL: postgresql://gocontrole:gocontrole_secret@postgres:5432/gocontrole?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://gocontrole:gocontrole_secret@postgres:5432/gocontrole?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      JWT_SECRET: GoControle2026JwtSecretKey
      JWT_EXPIRES_IN: 24h
      ADMIN_EMAIL: admin@gocontrole.local
      ADMIN_PASSWORD: GoControle2026Secure
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gocontrole_postgres:
  gocontrole_redis:
